<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Page 01</title>
  <link rel="stylesheet" href="page01.css">
</head>
<body>

  <div class="ventana">
    <!-- Barra superior con 4 iconos SVG -->
    <div class="barra">
      <svg class="icono" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      <svg class="icono" viewBox="0 0 24 24"><path d="M4 22V4a2 2 0 0 1 2-2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
      <svg class="icono" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <svg class="icono" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>

    <form class="formulario">
      <!-- 2a: text fields con floating label -->
      <div class="campo">
        <input type="text" id="name" required>
        <label for="name">Name</label>
      </div>

      <div class="campo">
        <input type="email" id="email" required>
        <label for="email">E-mail</label>
      </div>

      <div class="campo">
        <input type="text" id="item" required>
        <label for="item">Item</label>
      </div>

      <!-- 2c: campo de imagen con drag & drop -->
      <div class="campo-imagen" id="dropZone">
        <svg class="icono-imagen" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span id="fileName">Arrastra una imagen aquí</span>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <!-- checkbox -->
      <label class="checkbox-container">
        <input type="checkbox" id="agree">
        Do you agree?
      </label>

      <!-- 2 botones -->
      <div class="botones">
        <button type="submit" class="btn btn-submit">SUBMIT</button>
        <button type="reset" class="btn btn-clear">CLEAR</button>
      </div>
    </form>
  </div>

  <script>
  const dropZone = document.getElementById('dropZone');
  const fileName = document.getElementById('fileName');
  const fileInput = document.getElementById('fileInput'); // nuevo

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');

    const file = e.dataTransfer.files[0];
    if (file) {
      // Asigna el archivo al input oculto para conservarlo y enviarlo en el submit
      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      fileInput.files = dataTransfer.files;

      // Muestra el pathname tal como lo expone el navegador (ej: C:\fakepath\foto.png)
      fileName.textContent = fileInput.value;
    }
  });
</script>

</body>
</html>
