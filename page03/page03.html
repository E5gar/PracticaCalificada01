<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Zapatos</title>
    <link rel="stylesheet" href="page03.css">
  </head>
  <body>
    <main class="container">
      <section class="best-sellers">
        <h2 class="section-title">LO MÁS VENDIDO</h2>

        <nav class="tabs">
          <button class="tab active" type="button">DAMAS</button>
          <button class="tab" type="button">CABALLEROS</button>
          <button class="tab" type="button">KIDS</button>
        </nav>

        <div class="products-row">
          <article class="product-card">
            <div class="product-image">
              <img src="assets/01botas.jpg" alt="Botas Sokso" />
            </div>
            <div class="product-badge">
              <span>Botas Sokso S/189.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="assets/02zapatilla.jpg" alt="Zapatilla Sokso" />
            </div>
            <div class="product-badge">
              <span>Zapatilla Sokso S/118.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="assets/03zapato.jpg" alt="Zapatos Estela" />
            </div>
            <div class="product-badge">
              <span>Zapatos Estela S/279.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="assets/04zapato.jpg" alt="Zapatos Nina Simik" />
            </div>
            <div class="product-badge">
              <span>Zapatos Nina Simik S/149.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>
        </div>
      </section>

      <section class="brands">
        <h2 class="section-title">GRANDES MARCAS</h2>

        <div class="brands-row">
          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/05adidashombre.jpg" alt="Adidas Hombre" />
            </div>
            <p class="brand-label">Adidas Hombre</p>
          </div>

          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/06adidasmujer.jpg" alt="Adidas Mujer" />
            </div>
            <p class="brand-label">Adidas Mujer</p>
          </div>

          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/07nikehombre.jpg" alt="Nike Hombre" />
            </div>
            <p class="brand-label">Nike Hombre</p>
          </div>

          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/08nikemujer.jpg" alt="Nike Mujer" />
            </div>
            <p class="brand-label">Nike Mujer</p>
          </div>

          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/09pumahombre.jpg" alt="Puma Hombre" />
            </div>
            <p class="brand-label">Puma Hombre</p>
          </div>

          <div class="brand-item">
            <div class="brand-circle">
              <img src="assets/10pumamujer.jpg" alt="Puma Mujer" />
            </div>
            <p class="brand-label">Puma Mujer</p>
          </div>
        </div>
      </section>

      <section class="banners">
        <div class="banner">
          <img src="assets/11seccionbotas.jpg" alt="Seccion Botas" />
          <div class="banner-overlay">
            <p class="banner-tag">Sección</p>
            <h3 class="banner-title">BOTAS</h3>
            <button class="banner-btn" type="button">
              Ver colección
              <span class="arrow">&gt;</span>
            </button>
          </div>
        </div>

        <div class="banner">
          <img src="assets/12seccionzapatilla.jpg" alt="Seccion Zapatillas" />
          <div class="banner-overlay">
            <p class="banner-tag">Sección</p>
            <h3 class="banner-title">ZAPATILLAS</h3>
            <button class="banner-btn" type="button">
              Ver colección
              <span class="arrow">&gt;</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
