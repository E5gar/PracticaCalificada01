<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Zapatos</title>
  </head>
  <body>
    <main class="container">
      <section class="best-sellers">
        <h2 class="section-title">LO MÁS VENDIDO</h2>

        <nav class="tabs">
          <button class="tab active" type="button">DAMAS</button>
          <button class="tab" type="button">CABALLEROS</button>
          <button class="tab" type="button">KIDS</button>
        </nav>

        <div class="products-row">
          <article class="product-card">
            <div class="product-image">
              <img src="" alt="Botas Sokso" />
            </div>
            <div class="product-badge">
              <span>Botas Sokso S/189.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="" alt="Zapatilla Sokso" />
            </div>
            <div class="product-badge">
              <span>Zapatilla Sokso S/118.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="" alt="Zapatos Estela" />
            </div>
            <div class="product-badge">
              <span>Zapatos Estela S/279.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>

          <article class="product-card">
            <div class="product-image">
              <img src="" alt="Zapatos Nina Simik" />
            </div>
            <div class="product-badge">
              <span>Zapatos Nina Simik S/149.00</span>
              <span class="badge-arrow">&gt;</span>
            </div>
          </article>
        </div>
      </section>

    </main>
  </body>
</html>
